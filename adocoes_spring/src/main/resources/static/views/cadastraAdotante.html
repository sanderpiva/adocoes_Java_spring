<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Adotante</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div class="container">
        <h2>Cadastrar Novo Adotante</h2>
        
        <form id="form-cadastro">
            <input type="text" id="nome" placeholder="Nome do Adotante" required><br>
            <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx" required><br>
            <input type="email" id="email" placeholder="email" required><br>
            
            <button type="submit">Salvar Adotante</button>
        </form>
        
        <br>
        <a href="../index.html">Voltar para Home</a>
    </div>

    <script src="../js/scriptAdotante.js"></script>
</body>
</html>
